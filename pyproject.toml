[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "chemsmart-ml"
version = "0.1.0"
description = "Paired low-to-high level molecular property learning for CHEMSMART"
requires-python = ">=3.10"
readme = "README.md"
dependencies = ["numpy>=1.24", "click>=8", "PyYAML>=6", "matplotlib>=3.7"]
[project.optional-dependencies]
morgan = ["rdkit>=2024.3"]
plot = ["matplotlib>=3.7"]
host = ["chemsmart>=3.4.5,<4"]
test = ["pytest>=8"]
[project.scripts]
chemsmart-ml = "chemsmart_ml.cli:main"
[project.entry-points."chemsmart.job_commands"]
ml = "chemsmart_ml.integration:ml"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
