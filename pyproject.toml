[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "chemsmart-ml"
version = "0.1.0"
description = "Paired low-to-high level molecular property learning for CHEMSMART"
requires-python = ">=3.10"
readme = "README.md"
dependencies = ["numpy>=1.24", "click>=8", "PyYAML>=6", "matplotlib>=3.7"]
[project.optional-dependencies]
trees = ["scikit-learn>=1.6,<2"]
nonlinear = ["scikit-learn>=1.6,<2"]
morgan = ["rdkit>=2024.3"]
plot = ["matplotlib>=3.7"]
host = ["chemsmart>=3.4.5,<4"]
test = ["pytest>=8"]
[project.scripts]
chemsmart-ml = "chemsmart_ml.cli:main"
[project.entry-points."chemsmart.job_commands"]
ml = "chemsmart_ml.integration:ml"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.black]
line-length = 79
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 79

[tool.ruff]
target-version = "py310"
line-length = 79
